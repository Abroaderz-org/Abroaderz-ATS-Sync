[package]
name = "abroaderz-ats-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Document Parsing
pdf-extract = "0.12"
image = "0.25"

# Export Engines
rust_xlsxwriter = { version = "0.89", features = ["serde"] }
csv = "1.3"

# CLI & Utilities
walkdir = "2.5"
regex = "1.10"