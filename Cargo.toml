[package]
name = "abroaderz-ats-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Document & Image Processing
pdf-extract = "0.12"
lopdf = "0.34"
image = "0.25"
ocrs = "0.12"
rten = "0.24"

# Export Engines
rust_xlsxwriter = { version = "0.89", features = ["serde"] }
csv = "1.3"

# Heuristics & Text Processing
regex = "1.10"
walkdir = "2.5"
strsim = "0.11"
phonenumber = "0.3"

# Desktop GUI, Native Dialogs & System Handlers
eframe = "0.29"
rfd = "0.15"
open = "5.3"