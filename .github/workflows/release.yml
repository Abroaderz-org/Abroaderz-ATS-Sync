name: Build and Release Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: abroaderz-ats-sync.exe
            asset_name: Abroaderz-ATS-Sync-Windows-x64.zip

          - name: macOS Apple Silicon (M-Series)
            os: macos-latest
            target: aarch64-apple-darwin
            binary_name: abroaderz-ats-sync
            asset_name: Abroaderz-ATS-Sync-macOS-ARM64.tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      # Global Rust compiler caching
      - name: Rust Cache Action
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Package Windows Binary
        if: runner.os == 'Windows'
        run: |
          7z a -tzip "${{ matrix.platform.asset_name }}" "./target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary_name }}"

      - name: Package macOS Binary
        if: runner.os == 'macOS'
        run: |
          cd target/${{ matrix.platform.target }}/release/
          tar -czf "../../../${{ matrix.platform.asset_name }}" "${{ matrix.platform.binary_name }}"
          cd ../../../

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.name }}
          path: ${{ matrix.platform.asset_name }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish to Latest Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "Latest Continuous Build"
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}